name: Inkline
options:
  bundleIdPrefix: nl.rorymeijer
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: nl
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    # Env var wint (releasescript); de default laat IDE-builds ondertekenen.
    DEVELOPMENT_TEAM: "$(INKLINE_TEAM_ID:default=GPYS6SK835)"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    COMBINE_HIDPI_IMAGES: YES

packages:
  Inkline:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    from: 0.8.0

targets:
  Inkline:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      # Compiled straight into the app: this is the only code that touches the
      # tree-sitter package, and keeping it out of the offline core package is
      # what lets `swift test` run without network access.
      - path: ../Sources/InklineTreeSitter
        name: TreeSitter
    dependencies:
      - package: Inkline
        product: InklineKit
        embed: true
        codeSign: true
      - package: Sparkle
      - package: SwiftTreeSitter
      - target: JSONFormatterPlugin
        embed: true
        codeSign: true
      - target: HexViewerPlugin
        embed: true
        codeSign: true
      - target: ColumnToolsPlugin
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rorymeijer.inkline
        PRODUCT_NAME: Inkline
        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Supporting/Inkline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "Developer ID Application"
    scheme:
      testTargets: []
      gatherCoverageData: false

  # ---- Example plugins -------------------------------------------------
  JSONFormatterPlugin:
    type: bundle
    platform: macOS
    sources:
      - ../Plugins/JSONFormatter/Sources
    dependencies:
      - package: Inkline
        product: InklineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rorymeijer.inkline.plugin.jsonformatter
        PRODUCT_NAME: JSONFormatter
        WRAPPER_EXTENSION: inklineplugin
        INFOPLIST_FILE: ../Plugins/JSONFormatter/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../../../../Frameworks"
        SKIP_INSTALL: YES

  HexViewerPlugin:
    type: bundle
    platform: macOS
    sources:
      - ../Plugins/HexViewer/Sources
    dependencies:
      - package: Inkline
        product: InklineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rorymeijer.inkline.plugin.hexviewer
        PRODUCT_NAME: HexViewer
        WRAPPER_EXTENSION: inklineplugin
        INFOPLIST_FILE: ../Plugins/HexViewer/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../../../../Frameworks"
        SKIP_INSTALL: YES

  ColumnToolsPlugin:
    type: bundle
    platform: macOS
    sources:
      - ../Plugins/ColumnTools/Sources
    dependencies:
      - package: Inkline
        product: InklineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rorymeijer.inkline.plugin.columntools
        PRODUCT_NAME: ColumnTools
        WRAPPER_EXTENSION: inklineplugin
        INFOPLIST_FILE: ../Plugins/ColumnTools/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../../../../Frameworks"
        SKIP_INSTALL: YES

schemes:
  Inkline:
    build:
      targets:
        Inkline: all
    run:
      config: Debug
    archive:
      config: Release
